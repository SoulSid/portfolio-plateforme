document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';

      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');

    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;

          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }

    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

<p style=\"font-size:12px;color:#5C6E7A;padding-top:18px\" data-en=\"Messages land in the back-office inbox, alongside drafts and published pages.\">Les messages arrivent dans la boîte de réception de l'arrière-boutique, à côté des brouillons et des pages publiées.<\u002Fp>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n  <\u002Fsc-if>\n\n  <sc-if value=\"{{ bHome }}\" hint-placeholder-val=\"{{ false }}\">\n  <section data-screen-label=\"Accueil B\" style=\"background:#0A0A0F\">\n    <div style=\"max-width:1320px;margin:0 auto;padding:34px 24px 0\">\n      <div style=\"display:grid;grid-template-columns:minmax(0,1.35fr) minmax(280px,1fr);gap:10px;align-items:stretch\">\n        <div style=\"border:2px solid #262633;background:#0E0E15;padding:40px 34px;position:relative;overflow:hidden;clip-path:polygon(0 14px,14px 14px,14px 0,100% 0,100% calc(100% - 14px),calc(100% - 14px) calc(100% - 14px),calc(100% - 14px) 100%,0 100%)\">\n          <div style=\"position:absolute;right:-30px;top:-30px;width:220px;height:220px;background-image:repeating-conic-gradient(#15151F 0% 25%,#0E0E15 0% 50%);background-size:16px 16px\"><\u002Fdiv>\n          <div style=\"position:relative\">\n            <div style=\"font-size:10.5px;letter-spacing:0.3em;color:#C6F135;padding-bottom:26px\" data-en=\"REG 00 · PERSONAL PLATFORM\">REG 00 · PLATEFORME PERSONNELLE<\u002Fdiv>\n            <h1 style=\"margin:0;font-family:Archivo,sans-serif;font-weight:900;font-size:clamp(40px,6.8vw,92px);line-height:0.88;letter-spacing:-0.045em;color:#F4F4F8;text-transform:uppercase\">\n              <span data-en=\"LIVE\">DOSSIER<\u002Fspan><br><span style=\"color:#C6F135\" data-en=\"DOSSIER.\">VIVANT.<\u002Fspan>\n            <\u002Fh1>\n            <p style=\"max-width:44ch;color:#8E8EA0;font-size:15px;padding:28px 0 0\" data-en=\"Not a two-page CV. Every finished project and every technical experiment becomes a published page, dated the day it ends.\">Pas un CV de deux pages. Chaque projet livré et chaque expérimentation technique devient une page publiée, datée du jour où elle se termine.<\u002Fp>\n            <div style=\"display:flex;gap:12px;flex-wrap:wrap;padding:34px 0 0\">\n              <div sc-camel-on-click=\"{{ navLabs }}\" style=\"cursor:pointer;padding:15px 24px;background:#C6F135;color:#0A0A0F;font-size:11.5px;letter-spacing:0.16em;font-weight:700;box-shadow:6px 6px 0 #2A3A00\" style-hover=\"box-shadow:2px 2px 0 #2A3A00;transform:translate(4px,4px)\"><span data-en=\"OPEN WORKSHOP\">OUVRIR L'ATELIER<\u002Fspan><\u002Fdiv>\n              <div sc-camel-on-click=\"{{ navWork }}\" style=\"cursor:pointer;padding:15px 24px;border:2px solid #33334A;color:#C9C9D8;font-size:11.5px;letter-spacing:0.16em\" style-hover=\"border-color:#C6F135;color:#C6F135\"><span data-en=\"DELIVERED WORK\">RÉALISATIONS<\u002Fspan><\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n\n        <div style=\"display:flex;flex-direction:column;gap:10px\">\n          <div style=\"border:2px solid #262633;background:#0E0E15;padding:22px\">\n            <div style=\"font-size:10px;letter-spacing:0.26em;color:#6E6E84;padding-bottom:16px\" data-en=\"LATEST ENTRIES\">DERNIÈRES ENTRÉES<\u002Fdiv>\n            <div style=\"display:flex;flex-direction:column;gap:2px\">\n              <sc-for list=\"{{ homeLabs }}\" as=\"lab\" hint-placeholder-count=\"3\">\n                <div sc-camel-on-click=\"{{ lab.open }}\" style=\"cursor:pointer;display:grid;grid-template-columns:8px 1fr;gap:12px;padding:12px;background:#12121A\" style-hover=\"background:#1A1A26\">\n                  <div style=\"background:#C6F135\"><\u002Fdiv>\n                  <div>\n                    <div style=\"font-size:9.5px;letter-spacing:0.2em;color:#6E6E84;padding-bottom:6px\">{{ lab.ref }} · {{ lab.date }}<\u002Fdiv>\n                    <div style=\"font-family:Archivo,sans-serif;font-weight:700;font-size:14.5px;color:#EDEDF4;line-height:1.25\">{{ lab.title }}<\u002Fdiv>\n                  <\u002Fdiv>\n                <\u002Fdiv>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"border:2px solid #262633;background:#0E0E15;padding:22px;flex:1\">\n            <div style=\"font-size:10px;letter-spacing:0.26em;color:#6E6E84;padding-bottom:14px\" data-en=\"PUBLISHING PIPELINE\">CHAÎNE DE PUBLICATION<\u002Fdiv>\n            <div style=\"display:flex;flex-direction:column;gap:8px;font-size:11.5px;letter-spacing:0.1em;color:#9A9AAE\">\n              <div style=\"display:flex;gap:10px\"><span style=\"color:#C6F135\">1<\u002Fspan><span data-en=\"WRITE IN THE BACK-OFFICE\">RÉDIGER DANS L'ARRIÈRE-BOUTIQUE<\u002Fspan><\u002Fdiv>\n              <div style=\"display:flex;gap:10px\"><span style=\"color:#C6F135\">2<\u002Fspan><span data-en=\"SAVE A DRAFT, PREVIEW\">ENREGISTRER, PRÉVISUALISER<\u002Fspan><\u002Fdiv>\n              <div style=\"display:flex;gap:10px\"><span style=\"color:#C6F135\">3<\u002Fspan><span data-en=\"PUBLISH — ONLINE AT ONCE\">PUBLIER — EN LIGNE AUSSITÔT<\u002Fspan><\u002Fdiv>\n            <\u002Fdiv>\n            <div style=\"display:flex;gap:3px;padding-top:20px\">\n              <div style=\"height:14px;flex:1;background:#C6F135\"><\u002Fdiv><div style=\"height:14px;flex:1;background:#C6F135\"><\u002Fdiv><div style=\"height:14px;flex:1;background:#C6F135\"><\u002Fdiv><div style=\"height:14px;flex:1;background:#1F1F2C\"><\u002Fdiv><div style=\"height:14px;flex:1;background:#1F1F2C\"><\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px;padding:10px 0 0\">\n        <div style=\"border:2px solid #262633;background:#0E0E15;padding:22px\">\n          <div style=\"font-family:Archivo,sans-serif;font-weight:900;font-size:42px;color:#F4F4F8;line-height:1\">34<\u002Fdiv>\n          <div style=\"font-size:10px;letter-spacing:0.2em;color:#6E6E84;padding-top:8px\" data-en=\"REPORTS\">COMPTES RENDUS<\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"border:2px solid #262633;background:#0E0E15;padding:22px\">\n          <div style=\"font-family:Archivo,sans-serif;font-weight:900;font-size:42px;color:#F4F4F8;line-height:1\">07<\u002Fdiv>\n          <div style=\"font-size:10px;letter-spacing:0.2em;color:#6E6E84;padding-top:8px\" data-en=\"PROJECTS\">PROJETS<\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"border:2px solid #262633;background:#0E0E15;padding:22px\">\n          <div style=\"font-family:Archivo,sans-serif;font-weight:900;font-size:42px;color:#F4F4F8;line-height:1\">03<\u002Fdiv>\n          <div style=\"font-size:10px;letter-spacing:0.2em;color:#6E6E84;padding-top:8px\" data-en=\"SERIES\">SÉRIES<\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"border:2px solid #C6F135;background:#C6F135;padding:22px\">\n          <div style=\"font-family:Archivo,sans-serif;font-weight:900;font-size:42px;color:#0A0A0F;line-height:1\">5<span style=\"font-size:20px\">min<\u002Fspan><\u002Fdiv>\n          <div style=\"font-size:10px;letter-spacing:0.2em;color:#2A3A00;padding-top:8px\" data-en=\"TO PUBLISH\">POUR PUBLIER<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:10px;padding:10px 0 40px\">\n        <div style=\"border:2px solid #262633;background:#0E0E15;padding:24px\">\n          <div style=\"font-size:10.5px;letter-spacing:0.24em;color:#C6F135;padding-bottom:12px\">001 · <span data-en=\"NO FRICTION\">SANS FREIN<\u002Fspan><\u002Fdiv>\n          <p style=\"margin:0;color:#8E8EA0;font-size:13.5px\" data-en=\"When publishing requires a technical step, you postpone it. Here it takes five minutes.\">Quand publier demande une manipulation technique, on repousse. Ici, ça prend cinq minutes.<\u002Fp>\n        <\u002Fdiv>\n        <div style=\"border:2px solid #262633;background:#0E0E15;padding:24px\">\n          <div style=\"font-size:10.5px;letter-spacing:0.24em;color:#C6F135;padding-bottom:12px\">010 · <span data-en=\"IT COMPOUNDS\">ÇA CAPITALISE<\u002Fspan><\u002Fdiv>\n          <p style=\"margin:0;color:#8E8EA0;font-size:13.5px\" data-en=\"Every documented piece of work stays, and keeps working for me while I do something else.\">Chaque travail documenté reste, et continue de travailler pour moi pendant que je fais autre chose.<\u002Fp>\n        <\u002Fdiv>\n        <div style=\"border:2px solid #262633;background:#0E0E15;padding:24px\">\n          <div style=\"font-size:10.5px;letter-spacing:0.24em;color:#C6F135;padding-bottom:12px\">011 · <span data-en=\"IT PROVES\">ÇA PROUVE<\u002Fspan><\u002Fdiv>\n          <p style=\"margin:0;color:#8E8EA0;font-size:13.5px\" data-en=\"Saying you can do it is a claim. Thirty dated reports are a demonstration.\">Dire qu'on sait faire est une affirmation. Trente comptes rendus datés sont une démonstration.<\u002Fp>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n  <\u002Fsc-if>\n\n  <sc-if value=\"{{ bWork }}\" hint-placeholder-val=\"{{ false }}\">\n  <section data-screen-label=\"Réalisations B\" style=\"background:#0A0A0F\">\n    <div style=\"max-width:1320px;margin:0 auto;padding:34px 24px 60px\">\n      <div style=\"display:flex;align-items:flex-end;justify-content:space-between;gap:20px;flex-wrap:wrap;border-bottom:2px solid #262633;padding-bottom:22px\">\n        <h1 style=\"margin:0;font-family:Archivo,sans-serif;font-weight:900;font-size:clamp(30px,5vw,60px);line-height:0.92;letter-spacing:-0.04em;color:#F4F4F8;text-transform:uppercase\"><span style=\"color:#3A3A4E\">REG 01 / <\u002Fspan><span data-en=\"CLIENT PROJECTS\">PROJETS CLIENTS<\u002Fspan><\u002Fh1>\n        <div style=\"font-size:10.5px;letter-spacing:0.2em;color:#6E6E84\" data-en=\"CONTEXT · ROLE · OUTCOME\">CONTEXTE · RÔLE · RÉSULTAT<\u002Fdiv>\n      <\u002Fdiv>\n\n      <div style=\"display:flex;gap:8px;flex-wrap:wrap;padding:20px 0 22px;align-items:center\">\n        <sc-for list=\"{{ workFilters }}\" as=\"f\" hint-placeholder-count=\"5\">\n          <div sc-camel-on-click=\"{{ f.pick }}\" style=\"cursor:pointer;padding:8px 14px;font-size:10.5px;letter-spacing:0.14em;border:2px solid {{ f.bd }};color:{{ f.fg }};background:{{ f.bg }}\" style-hover=\"border-color:#C6F135\">{{ f.label }}<\u002Fdiv>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n\n      <div style=\"display:flex;flex-direction:column;gap:10px\">\n        <sc-for list=\"{{ works }}\" as=\"w\" hint-placeholder-count=\"3\">\n          <div sc-camel-on-click=\"{{ w.open }}\" style=\"cursor:pointer;border:2px solid #262633;background:#0E0E15;display:grid;grid-template-columns:74px minmax(0,1fr) 130px;gap:0;align-items:stretch\" style-hover=\"border-color:#C6F135\">\n            <div style=\"background:#12121A;display:flex;align-items:center;justify-content:center;font-size:11px;letter-spacing:0.14em;color:#C6F135;border-right:2px solid #262633\">{{ w.ref }}<\u002Fdiv>\n            <div style=\"padding:22px 24px\">\n              <div style=\"font-family:Archivo,sans-serif;font-weight:800;font-size:21px;color:#F4F4F8;line-height:1.2;text-transform:uppercase\">{{ w.title }}<\u002Fdiv>\n              <div style=\"font-size:13px;color:#8E8EA0;padding:9px 0 14px;max-width:74ch\">{{ w.excerpt }}<\u002Fdiv>\n              <div style=\"display:flex;gap:6px;flex-wrap:wrap\">\n                <sc-for list=\"{{ w.stack }}\" as=\"s\" hint-placeholder-count=\"3\">\n                  <span style=\"font-size:9.5px;letter-spacing:0.14em;color:#9A9AAE;background:#171722;padding:4px 8px\">{{ s }}<\u002Fspan>\n                <\u002Fsc-for>\n              <\u002Fdiv>\n            <\u002Fdiv>\n            <div style=\"border-left:2px solid #262633;padding:22px 18px;text-align:right;font-size:10.5px;letter-spacing:0.14em;color:#6E6E84\">{{ w.date }}<div style=\"color:#C6F135;font-size:18px;padding-top:14px\">→<\u002Fdiv><\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fs ot;#C6F135&quot;,&quot;#35E0D0&quot;,&quot;#6E4CFF&quot;],&quot;default&quot;:&quot;&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Direction&quot;},&quot;binaryTicker&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;Direction&quot;}}\">\nconst AMBER = '#FFB000';\nconst LIME = '#C6F135';\n\nconst WORKS = [\n  { ref:'0x01', date:'2026.04', tags:['web','data','ops'],\n    fr:{ t:\"Plateforme de gestion pour établissements scolaires\", e:\"Suivi des inscriptions, des notes et de la facturation pour un réseau de trois établissements.\",\n      c:\"Trois établissements géraient inscriptions et facturation sur des tableurs partagés. Chaque rentrée produisait des doublons et des écarts de facturation.\",\n      r:\"Recueil du besoin auprès des équipes administratives, modélisation des données, développement de l'application et reprise de l'historique.\",\n      res:\"Mise en service sur une rentrée complète. Temps de traitement d'une inscription ramené de 25 à 4 minutes.\" },\n    en:{ t:\"Management platform for schools\", e:\"Enrolment, grades and billing for a three-school network.\",\n      c:\"Three schools ran enrolment and billing on shared spreadsheets. Every new year produced duplicates and billing gaps.\",\n      r:\"Requirements with the admin teams, data modelling, application build, migration of historical records.\",\n      res:\"Live across a full school year. Enrolment handling down from 25 to 4 minutes.\" },\n    stack:['PostgreSQL','Django','Redis','Docker','Nginx'] },\n  { ref:'0x02', date:'2025.11', tags:['web','data'],\n    fr:{ t:\"Marketplace multi-vendeurs\", e:\"Catalogue, paiement fractionné entre vendeurs, tableau de bord marchand.\",\n      c:\"Un collectif d'artisans vendait sur des pages sociales, sans catalogue commun ni suivi des commandes.\",\n      r:\"Architecture du catalogue, intégration du paiement et de sa répartition, tableau toring\", e:\"Counter collection, threshold alerts, automated weekly reports.\",\n      c:\"Radio incidents were reported by users before the operator noticed them.\",\n      r:\"Counter collection, alerting rules, report formatting.\",\n      res:\"Mean detection down from several hours to eleven minutes.\" },\n    stack:['Python','Grafana','InfluxDB','SNMP'] },\n  { ref:'0x05', date:'2024.09', tags:['securite','ops'],\n    fr:{ t:\"Durcissement d'une infrastructure de paiement\", e:\"Revue des accès, cloisonnement réseau, journalisation centralisée.\",\n      c:\"Un audit externe avait relevé onze écarts, dont quatre bloquants pour la certification.\",\n      r:\"Plan de remédiation, cloisonnement, rotation des secrets, journalisation.\",\n      res:\"Onze écarts levés, certification obtenue au second passage.\" },\n    en:{ t:\"Payment infrastructure hardening\", e:\"Access review, network segmentation, centralised logging.\",\n      c:\"An external audit raised eleven findings, four of them blocking certification.\",\n      r:\"Remediation plan, segmentation, secret rotation, logging.\",\n      res:\"All eleven findings closed, certification granted on the second pass.\" },\n    stack:['Vault','Terraform','Wazuh','iptables'] }\n];\n\nfunction mkDays(total, done, seedFr, seedEn) {\n  const out = [];\n  for (let i = 1; i <= total; i++) {\n    const s = seedFr[(i - 1) % seedFr.length], se = seedEn[(i - 1) % seedEn.length];\n    out.push({\n      n: String(i).padStart(2, '0'), done: i <= done,\n      fr: { t: s, intent:\"Vérifier une hypothèse précise, isolée du reste, et écrire le compte rendu le soir même.\",\n        method:\"Montage d'un banc minimal, une seule variable modifiée par essai, mesures conservées brutes.\",\n        fail:\"La première tentative a échoué sur une hypothèse fausse au départ ; je la laisse dans le compte rendu, c'est la partie utile.\" },\n      en: { t: se, intent:\"Test one precise hypothesis, isolated from the rest, and write the report the same evening.\",\n        method:\"Minimal bench, one variable changed per run, raw measurements kept.\",\n        fail:\"The first attempt failed on a wrong initial assumption; I keep it in the report, it is the useful part.\" }\n    });\n  }\n  return out;\n}\n\nconst LABS = [\n  { ref:'W-018', date:'2026.07', tags:['securite','data'], total:20, done:14,\n    fr:{ t:\"20 jours de cryptographie appliquée\", e:\"Un chiffrement par jour, implémenté à la main, puis cassé quand c'est possible.\", meta:\"SÉRIE · 14/20 JOURS\" },\n    en:{ t:\"20 days of applied cryptography\", e:\"One cipher a day, implemented by hand, then broken where possible.\", meta:\"SERIES · 14/20 DAYS\" },\n    stack:['Python','OpenSSL','AES','RSA'],\n    days: mkDays(20, 14,\n      [\"Chiffrement de César et analyse de fréquence\",\"Vigenère et longueur de clé\",\"XOR à clé répétée\",\"Padding PKCS#7\",\"AES-CBC à la main\",\"Oracle de padding\",\"AES-CTR et réutilisation de nonce\",\"Fonctions de hachage\",\"HMAC et comparaison en temps constant\",\"Diffie-Hellman\",\"RSA jouet\",\"Signature et vérification\",\"Générateur pseudo-aléatoire\",\"Dérivation de clé\",\"Courbes elliptiques\",\"Échange authentifié\",\"Canal chiffré bout en bout\",\"Attaques par canal auxiliaire\",\"Rotation de clés\",\"Synthèse et relecture\"],\n      [\"Caesar cipher and frequency analysis\",\"Vigenère and key length\",\"Repeating-key XOR\",\"PKCS#7 padding\",\"AES-CBC by hand\",\"Padding oracle\",\"AES-CTR and nonce reuse\",\"Hash functions\",\"HMAC and constant-time compare\",\"Diffie-Hellman\",\"Toy RSA\",\"Sign and verify\",\"Pseudo-random generator\",\"Key derivation\",\"Elliptic curves\",\"Authenticated exchange\",\"End-to-end encrypted channel\",\"Side-channel attacks\",\"Key rotation\",\"Wrap-up and review\"]) },\n  { ref:'W-017', date:'2026.06', tags:['telecom'], total:12, done:12,\n    fr:{ t:\"12 jours sur la couche physique LTE\", e:\"Décodage d'une trame capturée, du symbole OFDM au bloc de transport.\", meta:\"SÉRIE · 12/12 JOURS\" },\n    en:{ t:\"12 days on the LTE physical layer\", e:\"Decoding a captured frame, from OFDM symbol to transport block.\", meta:\"SERIES · 12/12 DAYS\" },\n    stack:['GNU Radio','SDR','MATLAB'],\n    days: mkDays(12, 12,\n      [\"Capture d'une bande et spectre\",\"Synchronisation temporelle\",\"Estimation du canal\",\"Démodulation OFDM\",\"Désentrelacement\",\"Décodage turbo\",\"Blocs de transport\",\"Mesures de qualité\",\"Handover observé\",\"Puissance et bruit\",\"Erreurs résiduelles\",\"Compte rendu final\"],\n      [\"Band capture and spectrum\",\"Time synchronisation\",\"Channel estimation\",\"OFDM demodulation\",\"De-interleaving\",\"Turbo decoding\",\"Transport blocks\",\"Quality measurements\",\"Observed handover\",\"Power and noise\",\"Residual errors\",\"Final report\"]) },\n  { ref:'W-016', date:'2026.05', tags:['ops','data'], total:8, done:8,\n    fr:{ t:\"8 jours de bases de données sous contrainte\", e:\"Même jeu de requêtes, huit stratégies d'indexation, mesures conservées.\", meta:\"SÉRIE · 8/8 JOURS\" },\n    en:{ t:\"8 days of databases under pressure\", e:\"Same query set, eight indexing strategies, measurements kept.\", meta:\"SERIES · 8/8 DAYS\" },\n    stack:['PostgreSQL','pgbench','EXPLAIN'],\n    days: mkDays(8, 8,\n      [\"Jeu de données et référence\",\"Index B-tree\",\"Index partiels\",\"Index couvrants\",\"GIN et recherche plein texte\",\"Partitionnement\",\"Requêtes parallèles\",\"Bilan chiffré\"],\n      [\"Dataset and baseline\",\"B-tree index\",\"Partial indexes\",\"Covering indexes\",\"GIN and full-text search\",\"Partitioning\",\"Parallel queries\",\"Measured conclusions\"]) },\n  { ref:'W-015', date:'2026.03', tags:['securite'], total:1, done:1,\n    fr:{ t:\"Rejouer une attaque de désérialisation\", e:\"Reproduction en environnement isolé, puis correction et vérification.\", meta:\"UNITAIRE\" },\n    en:{ t:\"Replaying a deserialisation attack\", e:\"Reproduced in an isolated environment, then fixed and verified.\", meta:\"SINGLE\" },\n    stack:['Java','Docker','Burp'],\n    days: mkDays(1, 1, [\"Reproduction et correctif\"], [\"Reproduction and fix\"]) },\n  { ref:'W-014', date:'2026.02', tags:['web'], total:1, done:1,\n    fr:{ t:\"Rendu de 10 000 lignes sans virtualisation\", e:\"Ce que coûte réellement le DOM, mesuré plutôt que supposé.\", meta:\"UNITAIRE\" },\n    en:{ t:\"Rendering 10,000 rows without virtualisation\", e:\"What the DOM actually costs, measured instead of assumed.\", meta:\"SINGLE\" },\n    stack:['JavaScript','Chrome DevTools'],\n    days: mkDays(1, 1, [\"Mesure et conclusions\"], [\"Measurement and conclusions\"]) },\n  { ref:'W-013', date:'2026.01', tags:['ops','telecom'], total:5, done:5,\n    fr:{ t:\"5 jours de routage sans interface graphique\", e:\"Table de routage construite à la main, panne simulée à chaque étape.\", meta:\"SÉRIE · 5/5 JOURS\" },\n    en:{ t:\"5 days of routing without a GUI\", e:\"Routing table built by hand, a simulated failure at every step.\", meta:\"SERIES · 5/5 DAYS\" },\n    stack:['FRRouting','BGP','tcpdump'],\n    days: mkDays(5, 5,\n      [\"Topologie et adressage\",\"Routes statiques\",\"OSPF\",\"BGP entre deux AS\",\"Panne et convergence\"],\n      [\"Topology and addressing\",\"Static routes\",\"OSPF\",\"BGP between two AS\",\"Failure and convergence\"]) }\n];\n\nconst SKILLS = [\n  { fr:\"Backend & API\", en:\"Backend & APIs\", v:8 },\n  { fr:\"Bases de données\", en:\"Databases\", v:7 },\n  { fr:\"Sécurité applicative\", en:\"Application security\", v:6 },\n  { fr:\"Réseaux & télécoms\", en:\"Networks & telecoms\", v:7 },\n  { fr:\"Infrastructure & CI\", en:\"Infrastructure & CI\", v:6 },\n  { fr:\"Front-end\", en:\"Front-end\", v:5 }\n];\n\nconst TIMELINE = [\n  { year:'2024→', fr:{ t:\"Ingénieur indépendant\", d:\"Conception et livraison de plateformes métier pour des structures de 5 à 200 personnes.\" }, en:{ t:\"Independent engineer\", d:\"Designing and delivering business platforms for teams of 5 to 200.\" } },\n  { year:'2021→24', fr:{ t:\"Ingénieur logiciel — secteur télécom\", d:\"Supervision réseau, traitement de compteurs, outils d'exploitation.\" }, en:{ t:\"Software engineer — telecom\", d:\"Network monitoring, counter processing, operations tooling.\" } },\n  { year:'2019→21', fr:{ t:\"Développeur — éditeur logiciel\", d:\"Backend, migrations de données, mise en production.\" }, en:{ t:\"Developer — software vendor\", d:\"Backend, data migrations, releases.\" } },\n  { year:'2019', fr:{ t:\"Diplôme d'ingénieur\", d:\"Spécialité systèmes et réseaux.\" }, en:{ t:\"Engineering degree\", d:\"Systems and networks major.\" } }\n];\n\nconst CODE = `$ ./bench --iter 1000 --isolate\\n[00:00:01] baseline ......... 412 ms\\n[00:00:04] variant-A ........ 188 ms\\n[00:00:09] variant-B ........ 203 ms  (rejected)\\n[00:00:12] delta ............ -54.4 %`;\n\nclass Component extends DCLogic {\n  state = { dir:'a', lang:'fr', page:'home', work:0, lab:0, day:0, fWork:'all', fLab:'all' };\n\n  componentDidMount() {\n    const p = this.props, patch = {};\n    if (p.direction && p.direction !== this.state.dir) patch.dir = p.direction;\n    if (p.language && p.language !== this.state.lang) patch.lang = p.language;\n    if (Object.keys(patch).length) this.setState(patch);\n    this.applyLang();\n  }\n  componentDidUpdate() { this.applyLang(); }\n\n  applyLang() {\n    const en = this.state.lang === 'en';\n    document.querySelectorAll('[data-en]').forEach(el => {\n      if (el.dataset.fr === undefined) el.dataset.fr = el.textContent;\n      const next = en ? el.dataset.en : el.dataset.fr;\n      if (el.textContent !== next) el.textContent = next;\n    });\n  }\n\n  go(page, patch) { this.setState(Object.assign({ page }, patch || {})); window.scrollTo(0, 0); }\n  L(o) { return o[this.state.lang] || o.fr; }\n\n  bits(n, total, on, off) {\n    const a = [];\n    for (let i = 0; i < total; i++) a.push({ c: i < n ? on : off });\n    return a;\n  }\n\n  filterRow(list, cur, set) {\n    const T = { all:{fr:'TOUT',en:'ALL'}, web:{fr:'WEB',en:'WEB'}, data:{fr:'DATA',en:'DATA'},\n      securite:{fr:'SÉCURITÉ',en:'SECURITY'}, telecom:{fr:'TÉLÉCOMS',en:'TELECOM'}, ops:{fr:'INFRA / OPS',en:'INFRA / OPS'} };\n    const keys = ['all'].concat(Array.from(new Set(list.reduce((a, x) => a.concat(x.tags), []))));\n    return keys.map(k => {\n      const on = cur === k;\n      return { label:(T[k] || {fr:k,en:k})[this.state.lang] || k, pick:() => set(k),\n        bd:on ? this.acc : '#222C36', fg:on ? '#07090C' : '#8DA0AC', bg:on ? this.acc : 'transparent' };\n    });\n  }\n\n  labCard(l, i) {\n    const t = this.L(l);\n    return { ref:l.ref, date:l.date, title:t.t, excerpt:t.e, meta:t.meta,\n      stack:l.stack, bits:this.bits(l.done, l.total, this.acc, '#1B242D'),\n      open:() => this.go('labOne', { lab:i, day:0 }) };\n  }\n\n  renderVals() {\n    const s = this.state, lang = s.lang, dirA = s.dir === 'a';\n    this.acc = this.props.accent || (dirA ? AMBER : LIME);\n    const seg = (on) => ({ bg:on ? '#D6E2E8' : 'transparent', fg:on ? '#07090C' : '#7B8D99' });\n    const nav = (p) => { const on = s.page === p || (p === 'work' && s.page === 'workOne') || (p === 'labs' && s.page === 'labOne');\n      return { fg:on ? '#07090C' : '#8DA0AC', bg:on ? this.acc : 'transparent', bd:on ? this.acc : '#1B242D' }; };\n\n    const worksF = s.fWork === 'all' ? WORKS : WORKS.filter(w => w.tags.indexOf(s.fWork) > -1);\n    const labsF = s.fLab === 'all' ? LABS : LABS.filter(l => l.tags.indexOf(s.fLab) > -1);\n    const w = WORKS[s.work], wt = this.L(w);\n    const l = LABS[s.lab], lt = this.L(l);\n    const d = l.days[Math.min(s.day, l.days.length - 1)], dt = this.L(d);\n\n    const t = seg(dirA), tb = seg(!dirA), f = seg(lang === 'fr'), e = seg(lang === 'en');\n\n    return {\n      dirA:dirA, dirB:!dirA, ticker:this.props.binaryTicker !== false,\n      isHome:s.page === 'home' && dirA, isWork:s.page === 'work' && dirA, isWorkOne:s.page === 'workOne' && dirA,\n      isLabs:s.page === 'labs' && dirA, isLabOne:s.page === 'labOne' && dirA,\n      isProfile:s.page === 'profile' && dirA, isContact:s.page === 'contact' && dirA,\n      bHome:s.page === 'home' && !dirA, bWork:(s.page === 'work' || s.page === 'workOne') && !dirA,\n      bLabs:s.page === 'labs' && !dirA, bLabOne:s.page === 'labOne' && !dirA,\n      bProfile:(s.page === 'profile' || s.page === 'contact') && !dirA,\n      tabABg:t.bg, tabAFg:t.fg, tabBBg:tb.bg, tabBFg:tb.fg,\n      frBg:f.bg, frFg:f.fg, enBg:e.bg, enFg:e.fg,\n      setA:() => this.setState({ dir:'a' }), setB:() => this.setState({ dir:'b' }),\n      setFr:() => this.setState({ lang:'fr' }), setEn:() => this.setState({ lang:'en' }),\n      dirLabel: dirA ? 'DIRECTION 1A · OCTET' : 'DIRECTION 1B · BITFIELD',\n      goHome:() => this.go('home'),\n      navHome:() => this.go('home'), navWork:() => this.go('work'), navLabs:() => this.go('labs'),\n      navProfile:() => this.go('profile'), navContact:() => this.go('contact'),\n      nHomeFg:nav('home').fg, nHomeBg:nav('home').bg, nHomeBd:nav('home').bd,\n      nWorkFg:nav('work').fg, nWorkBg:nav('work').bg, nWorkBd:nav('work').bd,\n      nLabsFg:nav('labs').fg, nLabsBg:nav('labs').bg, nLabsBd:nav('labs').bd,\n      nProfFg:nav('profile').fg, nProfBg:nav('profile').bg, nProfBd:nav('profile').bd,\n      nContFg:nav('contact').fg, nContBg:nav('contact').bg, nContBd:nav('contact').bd,\n\n      homeLabs: LABS.slice(0, 3).map((x, i) => this.labCard(x, i)),\n      labs: labsF.map(x => this.labCard(x, LABS.indexOf(x))),\n      labCount: labsF.length + (lang === 'fr' ? ' ENTRÉES' : ' ENTRIES'),\n      labFilters: this.filterRow(LABS, s.fLab, k => this.setState({ fLab:k })),\n      workFilters: this.filterRow(WORKS, s.fWork, k => this.setState({ fWork:k })),\n      works: worksF.map(x => { const xt = this.L(x); const i = WORKS.indexOf(x);\n        return { ref:x.ref, date:x.date, title:xt.t, excerpt:xt.e, stack:x.stack, open:() => this.go('workOne', { work:i }) }; }),\n\n      one: { ref:w.ref, date:w.date, title:wt.t, excerpt:wt.e, context:wt.c, role:wt.r, result:wt.res, stack:w.stack },\n      lone: { ref:l.ref, date:l.date, title:lt.t, excerpt:lt.e, meta:lt.meta, stack:l.stack, total:String(l.total).padStart(2, '0'),\n        progress: l.done + '/' + l.total + (lang === 'fr' ? ' PUBLIÉS' : ' PUBLISHED') },\n      days: l.days.map((x, i) => { const cur = i === Math.min(s.day, l.days.length - 1);\n        return { n:x.n, title:this.L(x).t, pick:() => this.setState({ day:i }),\n          bg:cur ? this.acc : (x.done ? '#111820' : '#0A0E13'), bd:cur ? this.acc : '#1B242D',\n          fg:cur ? '#07090C' : (x.done ? '#A9BAC5' : '#3D4B57'),\n          rowBg:cur ? '#131B23' : '#07090C', rowFg:cur ? '#F2F7FA' : '#8497A3' }; }),\n      day: { n:d.n, title:dt.t, intent:dt.intent, method:dt.method, fail:dt.fail, code:CODE },\n\n      skills: SKILLS.map(x => ({ name:x[lang] || x.fr, bin:x.v.toString(2).padStart(8, '0'), bits:this.bits(x.v, 8, this.acc, '#1B242D') })),\n      timeline: TIMELINE.map(x => ({ year:x.year, title:this.L(x).t, desc:this.L(x).d }))\n    };\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
